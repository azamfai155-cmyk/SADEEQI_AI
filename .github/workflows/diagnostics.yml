name: SADEEQI diagnostics (artifact reports)

on:
  pull_request:
  push:
    branches:
      - feature/termux-bridge-foundation-2026-11-16
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-diagnostics:
    name: Backend tests and dependency audit with saved logs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26
      - name: Install dependencies
        run: |
          set -o pipefail
          npm install --ignore-scripts --no-audit --no-fund 2>&1 | tee npm-install.log
      - name: Run audit and tests independently
        id: checks
        if: always()
        run: |
          set +e
          npm audit --omit=dev --audit-level=high > npm-audit.log 2>&1
          audit_status=$?
          npm test > backend-tests.log 2>&1
          test_status=$?
          echo "audit_status=$audit_status" >> "$GITHUB_OUTPUT"
          echo "test_status=$test_status" >> "$GITHUB_OUTPUT"
          echo "===== npm audit (exit $audit_status) ====="
          cat npm-audit.log
          echo "===== npm test (exit $test_status) ====="
          cat backend-tests.log
      - name: Upload backend diagnostic logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sadeeqi-backend-diagnostics
          path: |
            npm-install.log
            npm-audit.log
            backend-tests.log
          if-no-files-found: warn
          retention-days: 7
      - name: Fail if a backend check failed
        if: always()
        run: |
          if [ "${{ steps.checks.outputs.audit_status }}" != "0" ] || [ "${{ steps.checks.outputs.test_status }}" != "0" ]; then
            exit 1
          fi

  semgrep-diagnostics:
    name: Semgrep scan with saved report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Semgrep
        run: python -m pip install --upgrade semgrep
      - name: Run Semgrep and preserve its report
        id: scan
        run: |
          set +e
          semgrep scan --error --config p/owasp-top-ten --json --output semgrep-report.json --exclude node_modules --exclude .gradle . > semgrep.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat semgrep.log
      - name: Upload Semgrep diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sadeeqi-semgrep-diagnostics
          path: |
            semgrep.log
            semgrep-report.json
          if-no-files-found: warn
          retention-days: 7
      - name: Fail if Semgrep found blocking issues
        if: always()
        run: |
          if [ "${{ steps.scan.outputs.status }}" != "0" ]; then exit 1; fi

  android-diagnostics:
    name: Android unit tests and debug build with saved log
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: "platform-tools platforms;android-34 platforms;android-35 build-tools;34.0.0 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947
        with:
          gradle-version: "8.11.1"
      - name: Run Android unit tests and assemble debug APK
        id: android
        env:
          SUPABASE_URL: ${{ secrets.SADEEQI_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SADEEQI_SUPABASE_ANON_KEY }}
        run: |
          set +e
          SUPABASE_URL="${SUPABASE_URL:-https://ci-placeholder.supabase.co}"
          SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY:-ci-placeholder-anon-key}"
          gradle --no-daemon --stacktrace --console=plain --warning-mode all --max-workers=2 :app:testDebugUnitTest :app:assembleDebug \
            -PsadeeqiApiBaseUrl="https://sadeeqi-ai-pdrk.vercel.app" \
            -PsadeeqiSupabaseUrl="$SUPABASE_URL" \
            -PsadeeqiSupabaseAnonKey="$SUPABASE_ANON_KEY" > android-build.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat android-build.log
      - name: Upload Android diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sadeeqi-android-diagnostics
          path: |
            android-build.log
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 7
      - name: Fail if Android checks failed
        if: always()
        run: |
          if [ "${{ steps.android.outputs.status }}" != "0" ]; then exit 1; fi
