name: SADEEQI Cloudflare Workers Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "backend/src/**"
      - "security/**"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/cloudflare-workers-deploy.yml"

permissions:
  contents: read

concurrency:
  group: sadeeqi-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Test and deploy production Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check required Cloudflare credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN as a GitHub Actions secret."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_ACCOUNT_ID as a GitHub Actions variable."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install project dependencies and Wrangler
        run: npm install --no-save wrangler@4

      - name: Run project tests
        run: npm test

      - name: Deploy the existing Cloudflare Worker
        run: npx wrangler deploy --config wrangler.jsonc --name sadeeqi-ai-v2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
