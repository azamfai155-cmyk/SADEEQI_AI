name: SADEEQI Security Baseline

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  backend-dependency-audit:
    name: Backend dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
      - name: Generate a lockfile for this repository (none is committed yet)
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Run backend tests
        run: npm test

  semgrep-sast:
    name: Semgrep OWASP SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Semgrep
        run: python -m pip install --upgrade semgrep
      - name: Scan repository for OWASP Top 10 patterns
        run: semgrep scan --error --config p/owasp-top-ten --json --output semgrep-report.json --exclude node_modules --exclude .gradle .
      - name: Upload Semgrep findings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: semgrep-security-findings
          path: semgrep-report.json
          if-no-files-found: ignore
