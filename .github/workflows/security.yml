name: SADEEQI Security Baseline

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  backend-dependency-audit:
    name: Backend dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate a lockfile for this repository (none is committed yet)
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Run backend tests
        run: npm test

  semgrep-sast:
    name: Semgrep OWASP SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Semgrep
        run: python -m pip install --upgrade semgrep
      - name: Scan repository for OWASP Top 10 patterns
        run: semgrep scan --config p/owasp-top-ten --json --output semgrep-report.json --exclude node_modules --exclude .gradle .
      - name: Upload Semgrep findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-security-findings
          path: semgrep-report.json
          if-no-files-found: ignore

  android-static-check:
    name: Android build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-34 platforms;android-35 build-tools;34.0.0 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run Android unit tests and debug build
        run: gradle :app:testDebugUnitTest :app:assembleDebug
