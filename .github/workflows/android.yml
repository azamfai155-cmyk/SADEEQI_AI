name: SADEEQI AI - tests and Android build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install backend dependencies
        run: npm install --no-audit --no-fund
      - name: Run backend tests
        run: npm test

  android-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build debug APK
        env:
          SADEEQI_APP_TOKEN: ${{ secrets.SADEEQI_APP_TOKEN }}
        run: |
          API_URL="https://sadeeqi-ai-pdrk.vercel.app"
          APP_TOKEN="${SADEEQI_APP_TOKEN:-}"
          if [ -z "$APP_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret SADEEQI_APP_TOKEN. APK chat would not authenticate."
            exit 1
          fi
          gradle :app:testDebugUnitTest :app:assembleDebug \
            -PsadeeqiApiBaseUrl="$API_URL" \
            -PsadeeqiAppToken="$APP_TOKEN"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SADEEQI-AI-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk

  android-instrumentation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run encrypted-memory instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disk-size: 2048M
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          disable-linux-hw-accel: false
          script: gradle :app:connectedDebugAndroidTest -PsadeeqiApiBaseUrl="https://sadeeqi-ai-pdrk.vercel.app"
