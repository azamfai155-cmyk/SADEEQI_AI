name: SADEEQI AI - unified Android build and tests

# Keep only the newest run for a branch.
concurrency:
  group: sadeeqi-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: Install backend dependencies
        run: npm install --no-audit --no-fund
      - name: Run backend tests
        run: npm test

  android:
    name: Android - unit tests, APK and emulator tests
    # Pin a known-compatible hosted image; ubuntu-latest moved this run to Ubuntu 26.04.
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: "platform-tools platforms;android-34 platforms;android-35 build-tools;34.0.0 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947
        with:
          gradle-version: "8.11.1"

      - name: Detect production Supabase configuration
        id: supabase-config
        env:
          SUPABASE_URL: ${{ secrets.SADEEQI_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SADEEQI_SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Supabase secrets are missing. CI will run unit tests and compile validation with placeholders, but will not publish an installable APK."
          fi

      - name: Run unit tests and compile debug APK
        timeout-minutes: 35
        env:
          SUPABASE_URL: ${{ secrets.SADEEQI_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SADEEQI_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          API_URL="https://sadeeqi-ai-pdrk.vercel.app"
          SUPABASE_URL="${SUPABASE_URL:-https://ci-placeholder.supabase.co}"
          SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY:-ci-placeholder-anon-key}"
          gradle --no-daemon --stacktrace --console=plain --warning-mode all --max-workers=2 :app:testDebugUnitTest :app:assembleDebug \
            -PsadeeqiApiBaseUrl="$API_URL" \
            -PsadeeqiSupabaseUrl="$SUPABASE_URL" \
            -PsadeeqiSupabaseAnonKey="$SUPABASE_ANON_KEY"

      # A distributable APK must contain the real project URL and public anon key.
      - name: Upload APK artifact
        if: success() && steps.supabase-config.outputs.configured == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: SADEEQI-AI-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Grant runner access to KVM
        run: |
          set -euo pipefail
          if [ ! -e /dev/kvm ]; then
            echo "::error::KVM device /dev/kvm is not available on this runner."
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
          ls -l /dev/kvm

      - name: Run instrumentation tests on API 34 emulator
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 35
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          SUPABASE_URL: ${{ secrets.SADEEQI_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SADEEQI_SUPABASE_ANON_KEY }}
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          # GitHub-hosted Ubuntu runners provide KVM; keep hardware CPU acceleration enabled.
          disable-linux-hw-accel: false
          cores: 2
          ram-size: 2048M
          disk-size: 4096M
          emulator-boot-timeout: 1200
          disable-animations: true
          # Cold boot a clean AVD; RAM and disk are configured through the
          # action's supported inputs rather than emulator command-line flags.
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -no-snapshot-load -wipe-data
          # The action splits script input on newlines and runs each line in a
          # separate shell. Keep this as one folded command so status + diagnostics
          # execute in the same shell after the emulator action has booted the device.
          script: >-
            set -e; adb wait-for-device; echo "Waiting for Android framework and Package Manager readiness"; ready=0; for attempt in $(seq 1 60); do boot="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"; if [ "$boot" = "1" ] && adb shell cmd package list packages >/dev/null 2>&1 && adb shell cmd activity get-config >/dev/null 2>&1; then ready=1; break; fi; echo "Android services not ready yet (attempt $attempt/60; boot=$boot)"; sleep 5; done; if [ "$ready" -ne 1 ]; then echo "::error::Android framework services did not become ready; refusing to start instrumentation while Package Manager or Activity Manager is unavailable"; adb shell getprop > android-emulator-properties.txt 2>&1 || true; adb logcat -d -v threadtime > android-instrumentation-logcat.txt 2>&1 || true; adb devices -l > android-adb-devices.txt 2>&1 || true; exit 1; fi; echo "Android framework ready; running instrumentation tests"; set +e; gradle :app:connectedDebugAndroidTest --stacktrace --console=plain --no-daemon --max-workers=2 -PsadeeqiApiBaseUrl="https://sadeeqi-ai-pdrk.vercel.app" -PsadeeqiSupabaseUrl="$SUPABASE_URL" -PsadeeqiSupabaseAnonKey="$SUPABASE_ANON_KEY"; test_status=$?; adb logcat -d -v threadtime > android-instrumentation-logcat.txt 2>&1 || true; adb shell dumpsys activity exit-info com.azzam.sadeeqi > android-process-exit-info.txt 2>&1 || true; adb devices -l > android-adb-devices.txt 2>&1 || true; exit "$test_status"

      - name: Upload Android instrumentation diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: SADEEQI-Android-instrumentation-diagnostics
          path: |
            android-instrumentation-logcat.txt
            android-process-exit-info.txt
          if-no-files-found: ignore
          retention-days: 7
