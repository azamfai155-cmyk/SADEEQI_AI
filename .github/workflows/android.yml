
name: Build SADEEQI AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Validate Android Manifest
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          path = "app/src/main/AndroidManifest.xml"

          try:
              ET.parse(path)
              print("Manifest XML is valid")
          except ET.ParseError as error:
              print("MANIFEST ERROR:", error)
              raise
          PY

      - name: Build APK
        env:
          SADEEQI_API_BASE_URL: ${{ secrets.SADEEQI_API_BASE_URL }}
          SADEEQI_APP_TOKEN: ${{ secrets.SADEEQI_APP_TOKEN }}
        run: |
          test -n "$SADEEQI_API_BASE_URL"
          test -n "$SADEEQI_APP_TOKEN"

          gradle :app:assembleDebug \
            -PsadeeqiApiBaseUrl="$SADEEQI_API_BASE_URL" \
            -PsadeeqiAppToken="$SADEEQI_APP_TOKEN"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SADEEQI-AI-APK
          path: app/build/outputs/apk/debug/app-debug.apk
