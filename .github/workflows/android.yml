name: SADEEQI AI - unified Android build and tests

# Keep only the newest run for a branch.
concurrency:
  group: sadeeqi-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install backend dependencies
        run: npm install --no-audit --no-fund
      - name: Run backend tests
        run: npm test

  android:
    name: Android - unit tests, APK and emulator tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-34 platforms;android-35 build-tools;34.0.0 build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Run unit tests and build debug APK
        timeout-minutes: 35
        env:
          SUPABASE_URL: ${{ secrets.SADEEQI_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SADEEQI_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          API_URL="https://sadeeqi-ai-pdrk.vercel.app"
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Missing required GitHub Actions secrets: SADEEQI_SUPABASE_URL and/or SADEEQI_SUPABASE_ANON_KEY. Refusing to build a broken APK."
            exit 1
          fi
          gradle --no-daemon --stacktrace --console=plain --warning-mode all --max-workers=2 :app:testDebugUnitTest :app:assembleDebug \
            -PsadeeqiApiBaseUrl="$API_URL" \
            -PsadeeqiSupabaseUrl="$SUPABASE_URL" \
            -PsadeeqiSupabaseAnonKey="$SUPABASE_ANON_KEY"

      - name: Run instrumentation tests on API 34 emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SUPABASE_URL: ${{ secrets.SADEEQI_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SADEEQI_SUPABASE_ANON_KEY }}
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          force-avd-creation: true
          # Avoid the runner's post-boot animation settings call, which can
          # hit a transient Android system-service restart on slow cold boots.
          disable-animations: false
          emulator-boot-timeout: 1200
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -wipe-data
          script: |
            set -euo pipefail
            # Wait for ADB and Android framework services after cold boot.
            adb wait-for-device
            booted=""
            for attempt in $(seq 1 120); do
              booted="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
              if [ "$booted" = "1" ]; then break; fi
              sleep 5
            done
            if [ "$booted" != "1" ]; then
              echo "::error::Android emulator did not finish booting."
              adb devices -l || true
              exit 1
            fi

            # Retry transient settings-service failures on slow emulator boots.
            for attempt in $(seq 1 12); do
              if adb shell settings put global verifier_verify_adb_installs 0 &&
                 adb shell settings put global package_verifier_enable 0; then
                break
              fi
              sleep 5
            done

            set +e
            gradle :app:connectedDebugAndroidTest --stacktrace --no-daemon --max-workers=2 -PsadeeqiApiBaseUrl="https://sadeeqi-ai-pdrk.vercel.app" -PsadeeqiSupabaseUrl="$SUPABASE_URL" -PsadeeqiSupabaseAnonKey="$SUPABASE_ANON_KEY"
            test_status=$?
            adb logcat -d -v threadtime > android-instrumentation-logcat.txt 2>&1 || true
            adb shell dumpsys activity exit-info com.azzam.sadeeqi > android-process-exit-info.txt 2>&1 || true
            adb devices -l > android-adb-devices.txt 2>&1 || true
            exit "$test_status"

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SADEEQI-AI-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore

      - name: Upload Android instrumentation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SADEEQI-Android-instrumentation-diagnostics
          path: |
            android-instrumentation-logcat.txt
            android-process-exit-info.txt
          if-no-files-found: ignore
