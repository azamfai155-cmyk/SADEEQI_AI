name: SADEEQI AI - tests and Android build

# Keep only the newest run for a branch; rapid commits should not exhaust
# runner capacity with multiple stale Android SDK/Gradle builds.
concurrency:
  group: sadeeqi-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install backend dependencies
        run: npm install --no-audit --no-fund
      - name: Run backend tests
        run: npm test

  android-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build debug APK
        env:
          SUPABASE_URL: ${{ secrets.SADEEQI_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SADEEQI_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          API_URL="https://sadeeqi-ai-pdrk.vercel.app"
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Missing required GitHub Actions secrets: SADEEQI_SUPABASE_URL and/or SADEEQI_SUPABASE_ANON_KEY. Refusing to build a broken APK."
            exit 1
          fi
          gradle :app:testDebugUnitTest :app:assembleDebug \
            -PsadeeqiApiBaseUrl="$API_URL" \
            -PsadeeqiSupabaseUrl="$SUPABASE_URL" \
            -PsadeeqiSupabaseAnonKey="$SUPABASE_ANON_KEY"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SADEEQI-AI-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
