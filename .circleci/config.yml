version: 2.1

jobs:
  backend-checks:
    docker:
      - image: cimg/node:22.11
    working_directory: ~/project
    steps:
      - checkout
      - run:
          name: Use isolated npm cache
          command: |
            mkdir -p /tmp/npm-cache
            echo 'Using /tmp/npm-cache to avoid permission conflicts in the shared CircleCI npm cache.'
      - run:
          name: Install backend dependencies
          command: npm_config_cache=/tmp/npm-cache npm install --no-audit --no-fund
      - run:
          name: Run backend tests
          command: npm_config_cache=/tmp/npm-cache npm test

workflows:
  backend-ci:
    jobs:
      - backend-checks
