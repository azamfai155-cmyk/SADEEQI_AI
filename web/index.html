<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10131c"><title>صديقي AI</title>
<style>
:root{color-scheme:dark;--bg:#0d1018;--panel:#151a25;--panel2:#1c2332;--line:#2a3448;--muted:#9ba7bd;--gold:#e6c77a;--blue:#7899ff;--text:#f4f6fb;--red:#ff9999;--green:#8ee0ad}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#26385f 0,transparent 48%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100dvh}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{max-width:1440px;margin:auto;min-height:100dvh;display:grid;grid-template-columns:260px 1fr}.sidebar{background:#111622;border-left:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:10px}.brand{display:flex;align-items:center;gap:12px;padding:8px 5px 20px}.logo{width:44px;height:44px;border-radius:15px;background:linear-gradient(135deg,#86a6ff,#7755dc);display:grid;place-items:center;font-size:24px}.brand h1{font-size:19px;margin:0}.brand small{color:var(--muted)}.nav{display:grid;gap:5px}.nav button,.side-action{background:transparent;color:#d9dfed;border:1px solid transparent;text-align:right;padding:11px 12px;border-radius:12px}.nav button.active,.nav button:hover,.side-action:hover{background:#28263a;border-color:#49425d;color:var(--gold)}.side-action{border-color:var(--line);margin-top:5px}.side-note{margin-top:auto;color:#8290a9;font-size:12px;line-height:1.8}.main{min-width:0;display:flex;flex-direction:column;padding:18px}.top{display:flex;align-items:center;justify-content:space-between;padding:8px 4px 16px;border-bottom:1px solid var(--line);gap:12px}.top h2{margin:0;font-size:19px}.top small{color:var(--muted)}.status{font-size:12px;color:var(--green)}.content{width:100%;max-width:1100px;margin:0 auto;padding:20px 0;flex:1;min-height:0}.panel{background:#151a25ed;border:1px solid var(--line);border-radius:19px;padding:17px;margin-bottom:14px}.muted{color:var(--muted)}.gold{color:var(--gold)}.small{font-size:12px;line-height:1.8}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.stack{display:grid;gap:10px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:12px;background:#0e1320;color:var(--text);outline:none}.field:focus{border-color:var(--blue)}textarea.field{resize:vertical;min-height:90px}.btn{border:0;border-radius:12px;padding:11px 16px;background:linear-gradient(135deg,#7899ff,#785bd9);color:white;font-weight:700}.btn.secondary{background:#2a3040;border:1px solid var(--line)}.btn.goldbtn{background:#8e6b35}.btn.danger{background:#652f3a}.btn:disabled{opacity:.5;cursor:not-allowed}.linkbtn{border:0;background:transparent;color:#b6c6ff;padding:9px}.auth{max-width:560px;margin:8vh auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:25px}.auth h2{margin-top:0}.hidden{display:none!important}.chatbox{display:flex;flex-direction:column;min-height:68vh}.messages{display:flex;flex-direction:column;gap:11px;overflow:auto;flex:1;min-height:250px;max-height:55vh;padding:10px 3px}.bubble{max-width:min(84%,720px);padding:12px 15px;border-radius:16px;white-space:pre-wrap;line-height:1.8;overflow-wrap:anywhere}.bubble.user{align-self:flex-start;background:#293a62;border-bottom-left-radius:5px}.bubble.assistant{align-self:flex-end;background:#202838;border:1px solid #303b50;border-bottom-right-radius:5px}.bubble .tools{display:flex;gap:5px;margin-top:5px}.tools button{border:0;background:transparent;color:#c3cce0;font-size:12px;padding:4px}.composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);background:#111622;border-radius:14px}.composer textarea{flex:1;min-height:46px;max-height:130px;resize:vertical}.pill{display:inline-flex;padding:5px 9px;border-radius:20px;background:#293143;color:#cbd5e9;font-size:12px}.notice{border:1px solid #62523a;background:#30291e;color:#f3dba8;border-radius:12px;padding:11px;font-size:13px;line-height:1.8}.ok{color:var(--green)}.bad{color:var(--red)}.metric{font-size:23px;font-weight:700}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.tabs button{border:1px solid var(--line);background:#151a25;color:#d7deec;border-radius:10px;padding:8px 11px}.tabs button.active{background:#393044;color:var(--gold)}.item{border:1px solid var(--line);border-radius:13px;padding:12px;margin:8px 0;background:#171e2b}.item h4{margin:0 0 5px}.audioitem{width:100%;margin:5px 0}audio{width:100%}.foot{color:#75829a;text-align:center;font-size:11px;padding:10px}.mobilebar{display:none}
@media(max-width:820px){.app{display:block}.sidebar{display:none}.main{padding:12px}.mobilebar{display:flex;gap:6px;overflow:auto;padding:7px 0;border-bottom:1px solid var(--line)}.mobilebar button{white-space:nowrap;background:#151a25;border:1px solid var(--line);border-radius:10px;color:#dce3f1;padding:8px 10px}.mobilebar button.active{color:var(--gold);border-color:#77623c}.content{padding:14px 0}.grid2{grid-template-columns:1fr}.bubble{max-width:94%}.chatbox{min-height:72vh}.messages{max-height:57vh}}
</style>
</head>
<body>
<section id="auth" class="auth">
<h2 class="gold" id="authTitle">مرحباً بك في صديقي AI</h2><p class="muted">سجّل الدخول بحسابك للوصول إلى نسخة الويب التجريبية.</p>
<input class="field" id="email" type="email" autocomplete="email" placeholder="البريد الإلكتروني">
<input class="field" id="password" type="password" autocomplete="current-password" placeholder="كلمة المرور">
<button class="btn" id="authSubmit" style="width:100%;margin-top:9px">تسجيل الدخول</button>
<button class="linkbtn" id="toggleAuth">إنشاء حساب جديد</button><div id="authError" class="bad small"></div>
</section>
<div id="app" class="app hidden">
<aside class="sidebar">
<div class="brand"><div class="logo">✦</div><div><h1>صديقي AI</h1><small>مساعدك الرقمي الشخصي</small></div></div>
<button class="side-action" id="newChat">＋ محادثة جديدة</button>
<nav class="nav" id="sideNav"></nav>
<div class="side-note">نسخة ويب للاختبار قبل إصدار Android.<br>بعض وظائف الهاتف الأصلية لا تعمل من المتصفح.</div>
</aside>
<main class="main">
<header class="top"><div><h2 id="pageTitle">الرئيسية</h2><small id="pageSub">مساعدك الرقمي الذكي</small></div><div class="row"><span class="status" id="connection">● متصل بالخدمة</span><button class="btn secondary" id="logout">خروج</button></div></header>
<nav class="mobilebar" id="mobileNav"></nav>
<div class="content" id="view"></div>
<div class="foot">صديقي AI · نسخة ويب تجريبية · لا تغيّر إعدادات الإنتاج</div>
</main></div>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const $=s=>document.querySelector(s), navItems=['الرئيسية','استوديو الصوت','التداول','موسيقى','SOCIAL HUB','البحث','الذاكرة','الأدوات','الإعدادات'];
let supabase,signUp=false,tab='الرئيسية',chat=[],pendingImage=null,media=[],audioIndex=-1,tradingTab='المكتبة',voiceAuto=false,recognition=null;
const safe=(s='')=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const read=(k,d)=>{try{return JSON.parse(localStorage.getItem('sadeeqi:'+k))??d}catch{return d}},write=(k,v)=>localStorage.setItem('sadeeqi:'+k,JSON.stringify(v));
const cfg=await fetch('/web-config').then(r=>r.json()).catch(()=>({}));
if(cfg.supabaseUrl&&cfg.supabaseAnonKey){supabase=createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);const {data}=await supabase.auth.getSession();if(data.session)enter();supabase.auth.onAuthStateChange((_e,s)=>s?enter():showAuth())}else{$('#authError').textContent='إعدادات Supabase غير متوفرة على هذه النسخة.';$('#authSubmit').disabled=true}
function showAuth(){$('#auth').classList.remove('hidden');$('#app').classList.add('hidden')}
function enter(){$('#auth').classList.add('hidden');$('#app').classList.remove('hidden');chat=read('chat',[]);renderNav();render()}
$('#toggleAuth').onclick=()=>{signUp=!signUp;$('#authTitle').textContent=signUp?'إنشاء حساب':'مرحباً بك في صديقي AI';$('#authSubmit').textContent=signUp?'إنشاء الحساب':'تسجيل الدخول';$('#toggleAuth').textContent=signUp?'لديك حساب؟ تسجيل الدخول':'إنشاء حساب جديد';$('#authError').textContent=''};
$('#authSubmit').onclick=async()=>{const email=$('#email').value.trim(),password=$('#password').value;if(!email||password.length<6){$('#authError').textContent='أدخل بريداً صحيحاً وكلمة مرور من 6 أحرف على الأقل.';return}const b=$('#authSubmit');b.disabled=true;try{const r=signUp?await supabase.auth.signUp({email,password}):await supabase.auth.signInWithPassword({email,password});if(r.error)throw r.error;if(signUp&&!r.data.session)$('#authError').textContent='تم إنشاء الحساب. أكّد بريدك ثم سجّل الدخول.';else enter()}catch(e){$('#authError').textContent=e.message}finally{b.disabled=false}};
$('#logout').onclick=()=>supabase?.auth.signOut();
function renderNav(){for(const id of ['sideNav','mobileNav']){$('#'+id).innerHTML=navItems.map(n=>'<button data-tab="'+safe(n)+'" class="'+(tab===n?'active':'')+'">'+safe(n)+'</button>').join('');$('#'+id).querySelectorAll('button').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;renderNav();render()})}}
$('#newChat').onclick=()=>{chat=[];write('chat',chat);tab='الرئيسية';renderNav();render()};
function setTab(t){tab=t;renderNav();render()}
function render(){const titles={'الرئيسية':'محادثة صديقي','استوديو الصوت':'إعدادات الصوت','التداول':'Trading Intelligence','موسيقى':'SADEEQI MUSIC','SOCIAL HUB':'مركز التواصل الاجتماعي','البحث':'البحث في المحادثات','الذاكرة':'ذاكرة صديقي','الأدوات':'أدوات صديقي','الإعدادات':'الإعدادات والخصوصية'};$('#pageTitle').textContent=titles[tab]||tab;$('#pageSub').textContent='مساعدك الرقمي الذكي';const v=$('#view');if(tab==='الرئيسية')home(v);else if(tab==='استوديو الصوت')voice(v);else if(tab==='التداول')trading(v);else if(tab==='موسيقى')music(v);else if(tab==='SOCIAL HUB')social(v);else if(tab==='البحث')search(v);else if(tab==='الذاكرة')memory(v);else if(tab==='الأدوات')toolsView(v);else settings(v)}
function home(v){v.innerHTML='<section class="panel chatbox"><div class="row"><span class="pill">المحادثة</span><span class="muted small">آخر 24 رسالة ترسل إلى الخادم</span></div><div class="messages" id="messages"></div><div id="imagePreview" class="small gold"></div><div class="composer"><button class="btn secondary" id="attach">＋</button><input id="imageFile" type="file" accept="image/jpeg,image/png,image/webp" hidden><textarea class="field" id="prompt" rows="1" placeholder="اسأل صديقي أي شيء..."></textarea><button class="btn secondary" id="dictate" title="إملاء">🎙</button><button class="btn" id="send">إرسال</button></div><div class="small muted">إرفاق صورة، الإملاء الصوتي، وإيقاف التوليد متاحة حسب دعم المتصفح.</div></section>';
const m=$('#messages');if(!chat.length)m.innerHTML='<div class="muted" style="margin:auto;text-align:center">أهلاً بك! أنا صديقي، اكتب رسالتك وسأساعدك.</div>';else chat.forEach((x,i)=>bubble(m,x,i));m.scrollTop=m.scrollHeight;
$('#attach').onclick=()=>$('#imageFile').click();$('#imageFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(!['image/jpeg','image/png','image/webp'].includes(f.type)||f.size>8*1024*1024){alert('اختر صورة JPEG أو PNG أو WebP بحجم أقل من 8 ميغابايت');return}pendingImage=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)});$('#imagePreview').textContent='تم إرفاق: '+f.name};
$('#dictate').onclick=dictate;$('#send').onclick=sendChat;$('#prompt').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat()}};
}
function bubble(m,x,i){const d=document.createElement('div');d.className='bubble '+(x.role==='assistant'?'assistant':'user');d.innerHTML='<b class="small gold">'+(x.role==='assistant'?'صديقي':'أنت')+'</b><div>'+safe(x.content)+'</div><div class="tools"><button data-act="copy">نسخ</button>'+(x.role==='assistant'?'<button data-act="speak">قراءة</button><button data-act="save">حفظ</button>':'<button data-act="edit">تعديل</button>')+'</div>';d.querySelectorAll('button').forEach(b=>b.onclick=()=>{const a=b.dataset.act;if(a==='copy')navigator.clipboard?.writeText(x.content);if(a==='speak')speak(x.content);if(a==='save'){const saved=read('saved',[]);saved.unshift(x.content);write('saved',saved);alert('تم الحفظ في ذاكرة المتصفح')}if(a==='edit'){$('#prompt').value=x.content;chat.splice(i,1);write('chat',chat);render()}});m.append(d)}
async function sendChat(){const p=$('#prompt'),text=p.value.trim();if(!text&&!pendingImage)return;const btn=$('#send');btn.disabled=true;const user={role:'user',content:text||'حلل الصورة المرفقة واشرح ما يظهر فيها.'};chat.push(user);write('chat',chat);render();const m=$('#messages');const wait=document.createElement('div');wait.className='bubble assistant';wait.textContent='صديقي يفكر...';m.append(wait);try{const {data}=await supabase.auth.getSession();if(!data.session)throw Error('انتهت الجلسة. سجّل الدخول مجدداً.');const input=chat.slice(-24).map((x,i,a)=>({role:x.role,content:pendingImage&&i===a.length-1?[{type:'input_text',text:x.content},{type:'input_image',image_url:pendingImage}]:x.content}));const r=await fetch('/v1/chat',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+data.session.access_token},body:JSON.stringify({input,enable_web_search:false})});const body=await r.json();if(!r.ok)throw Error(body.error||'تعذر إكمال الطلب');const answer=body.output_text||'لم يصل رد.';chat.push({role:'assistant',content:answer});write('chat',chat);wait.remove();bubble(m,chat.at(-1),chat.length-1);if(voiceAuto)speak(answer)}catch(e){wait.textContent='حدث خطأ: '+e.message}finally{pendingImage=null;btn.disabled=false;$('#imagePreview').textContent='';$('#prompt')?.focus()}}
function dictate(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('الإملاء الصوتي غير مدعوم في هذا المتصفح. جرّب Chrome.');return}recognition=new SR();recognition.lang='ar';recognition.interimResults=false;recognition.onresult=e=>$('#prompt').value+=' '+e.results[0][0].transcript;recognition.onerror=e=>alert('تعذر استخدام الميكروفون: '+e.error);recognition.start()}
function speak(t){if(!('speechSynthesis'in window)){alert('قراءة النص غير مدعومة في هذا المتصفح');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ar';speechSynthesis.speak(u)}
function voice(v){const s=read('voice',{auto:false,rate:1,pitch:1,volume:1});v.innerHTML='<div class="panel"><h3 class="gold">SADEEQI VOICE STUDIO</h3><p class="muted">إعدادات تحويل النص إلى كلام والإملاء الصوتي عبر محرك المتصفح أو الجهاز. الخيارات تختلف حسب المتصفح والنظام.</p><label>سرعة الكلام: <b id="rateVal">'+s.rate+'</b></label><input class="field" id="rate" type="range" min=".5" max="2" step=".05" value="'+s.rate+'"><label>حدة الصوت: <b id="pitchVal">'+s.pitch+'</b></label><input class="field" id="pitch" type="range" min=".5" max="2" step=".05" value="'+s.pitch+'"><label>مستوى الصوت: <b id="volVal">'+Math.round(s.volume*100)+'%</b></label><input class="field" id="vol" type="range" min="0" max="1" step=".05" value="'+s.volume+'"><label class="row"><input type="checkbox" id="auto" '+(s.auto?'checked':'')+'> قراءة ردود صديقي تلقائياً</label><button class="btn" id="testVoice">▶ اختبار الصوت</button><p class="small muted">لا يوجد بث صوتي حي Full-duplex أو كلمة تنبيه دائمة في التطبيق أو نسخة الويب.</p></div>';
['rate','pitch','vol'].forEach(id=>$('#'+id).oninput=()=>{const z=read('voice',s);z[id==='vol'?'volume':id]=Number($('#'+id).value);write('voice',z);$('#'+(id==='rate'?'rateVal':id==='pitch'?'pitchVal':'volVal')).textContent=id==='vol'?Math.round(z.volume*100)+'%':z[id]});$('#auto').onchange=()=>{const z=read('voice',s);z.auto=$('#auto').checked;voiceAuto=z.auto;write('voice',z)};voiceAuto=s.auto;$('#testVoice').onclick=()=>{const z=read('voice',s);if(!('speechSynthesis'in window))return alert('محرك الصوت غير مدعوم');const u=new SpeechSynthesisUtterance('مرحباً، أنا صديقي. هذا اختبار للصوت والإعدادات.');u.lang='ar';u.rate=z.rate;u.pitch=z.pitch;u.volume=z.volume;speechSynthesis.cancel();speechSynthesis.speak(u)}}
function trading(v){const terms=['Market Structure — بنية السوق: تسلسل القمم والقيعان الذي يصف حركة السعر.','BOS — كسر البنية: تجاوز قمة أو قاع بنيوي بما يدعم استمرار الاتجاه وفق قواعد التحليل.','MSS — تحول بنية السوق: تغير محتمل في السلوك البنيوي بعد إزاحة وكسر مستوى مهم.','Liquidity — السيولة: أوامر متجمعة غالباً قرب القمم والقيعان الواضحة.','BSL / SSL — سيولة الشراء / البيع: تجمعات أوامر أعلى القمم أو أسفل القيعان.','Liquidity Sweep — سحب السيولة: اختراق مستوى واضح ثم عودة السعر؛ ليس انعكاساً مؤكداً وحده.','Order Block — كتلة أوامر: منطقة سعرية يعرّفها المنهج وفق حركة الإزاحة السابقة.','FVG — فجوة قيمة عادلة: اختلال ثلاث شمعات يترك نطاقاً سعرياً غير متداخل.','Premium / Discount — علاوة / خصم: موقع السعر فوق أو تحت منتصف نطاق مرجعي.','POI — منطقة اهتمام: نطاق تراقبه بحثاً عن شروط تأكيد، لا إشارة دخول تلقائية.'];
v.innerHTML='<div class="panel"><h3 class="gold">SADEEQI TRADING INTELLIGENCE</h3><p class="muted">مكتبة دروس، مدرب SMC، حاسبات المخاطرة ونتائج Backtest اليدوية.</p><div class="tabs" id="tradeTabs"></div><div id="tradeBody"></div></div>';const tabs=['المكتبة','مدرب SMC','المخاطرة','Backtest'];$('#tradeTabs').innerHTML=tabs.map(t=>'<button class="'+(tradingTab===t?'active':'')+'">'+t+'</button>').join('');$('#tradeTabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{tradingTab=b.textContent;trading(v)});
const b=$('#tradeBody');if(tradingTab==='المكتبة'){const lessons=read('lessons',[]);b.innerHTML='<h4>حفظ درس ومصدره</h4><input class="field" id="lessonTitle" placeholder="عنوان الدرس"><input class="field" id="lessonChannel" value="Hermes Trading" placeholder="القناة / المدرّس"><input class="field" id="lessonUrl" placeholder="رابط المصدر"><textarea class="field" id="lessonNotes" placeholder="الصق التفريغ أو ملاحظات الدرس"></textarea><button class="btn goldbtn" id="saveLesson">حفظ الدرس</button><p class="small muted">الدروس محفوظة محلياً في هذا المتصفح، وليست مشفرة مثل ذاكرة Android.</p><h4>الدروس المحفوظة ('+lessons.length+')</h4>'+lessons.map((l,i)=>'<div class="item"><b>'+safe(l.title)+'</b><p class="small gold">'+safe(l.channel)+' '+safe(l.url)+'</p><p>'+safe(l.notes)+'</p><button class="btn danger" data-del="'+i+'">حذف</button></div>').join('');$('#saveLesson').onclick=()=>{const title=$('#lessonTitle').value.trim(),notes=$('#lessonNotes').value.trim();if(!title||!notes)return alert('أدخل عنوان الدرس ومحتواه');lessons.unshift({title,channel:$('#lessonChannel').value,url:$('#lessonUrl').value,notes});write('lessons',lessons);trading(v)};b.querySelectorAll('[data-del]').forEach(x=>x.onclick=()=>{lessons.splice(+x.dataset.del,1);write('lessons',lessons);trading(v)})}else if(tradingTab==='مدرب SMC'){b.innerHTML='<h4>قاموس المفاهيم الأساسية</h4>'+terms.map(t=>'<div class="item">'+safe(t)+'</div>').join('')+'<div class="item"><b>اختبار سريع</b><p>هل يكفي ظهور Liquidity Sweep وحده للدخول؟</p><select class="field" id="smcAnswer"><option>اختر إجابة</option><option>نعم، دائماً</option><option>لا، نحتاج سياقاً وتأكيداً</option></select><button class="btn" id="checkSmc">تحقق من الإجابة</button><p id="smcResult" class="gold"></p></div>';$('#checkSmc').onclick=()=>$('#smcResult').textContent=$('#smcAnswer').value==='لا، نحتاج سياقاً وتأكيداً'?'صحيح. نحتاج سياق الإطار الأعلى وشروط تأكيد وإبطال واضحة.':'السحب وحده لا يثبت انعكاساً.'}else if(tradingTab==='المخاطرة'){b.innerHTML='<h4>حاسبة المخاطرة وحجم المركز</h4><div class="grid2"><input class="field" id="bal" type="number" value="1000" placeholder="رصيد الحساب"><input class="field" id="risk" type="number" value="1" placeholder="المخاطرة %"><input class="field" id="dist" type="number" value="20" placeholder="مسافة وقف الخسارة"><input class="field" id="entry" type="number" step="any" value="1.0800" placeholder="الدخول"><input class="field" id="stop" type="number" step="any" value="1.0780" placeholder="وقف الخسارة"><input class="field" id="target" type="number" step="any" value="1.0840" placeholder="الهدف"></div><div class="row"><button class="btn" id="calcRisk">احسب المخاطرة</button><button class="btn secondary" id="calcRR">احسب R:R</button></div><p id="tradeResult" class="gold"></p><p class="small muted">حجم المركز وحدات نظرية فقط؛ تحويله إلى lots أو عقود يتطلب قيمة النقطة وحجم العقد وعملة الحساب لدى وسيطك.</p>';$('#calcRisk').onclick=()=>{const a=+$('#bal').value,r=+$('#risk').value,d=+$('#dist').value;if(!(a>0&&r>.01&&r<=100&&d>0))return $('#tradeResult').textContent='تحقق من إدخال أرقام موجبة وصحيحة.';const risk=a*r/100;$('#tradeResult').textContent='المبلغ المعرض للمخاطرة: '+risk.toFixed(2)+' | حجم المركز النظري: '+(risk/d).toFixed(4)+' وحدة'};$('#calcRR').onclick=()=>{const e=+$('#entry').value,s=+$('#stop').value,t=+$('#target').value;if(![e,s,t].every(Number.isFinite)||e===s)return $('#tradeResult').textContent='تحقق من الأسعار وأن الوقف لا يساوي الدخول.';$('#tradeResult').textContent='Risk/Reward = 1 : '+(Math.abs(t-e)/Math.abs(e-s)).toFixed(2)}}else{b.innerHTML='<h4>ملخص نتائج الاختبار التاريخي اليدوي</h4><div class="grid2"><input class="field" id="wins" type="number" value="20" placeholder="الصفقات الرابحة"><input class="field" id="losses" type="number" value="10" placeholder="الصفقات الخاسرة"><input class="field" id="avgWin" type="number" step="any" value="2" placeholder="متوسط الربح بوحدة R"><input class="field" id="avgLoss" type="number" step="any" value="1" placeholder="متوسط الخسارة بوحدة R"></div><button class="btn" id="calcBacktest">احسب النتائج</button><p id="btResult" class="gold"></p><p class="small muted">هذه حاسبة لنتائج تدخلها يدوياً وليست محرك Backtesting على بيانات شموع. لا تحسب Drawdown أو الانزلاق أو العمولات.</p>';$('#calcBacktest').onclick=()=>{const w=+$('#wins').value,l=+$('#losses').value,aw=+$('#avgWin').value,al=+$('#avgLoss').value;if(!Number.isInteger(w)||!Number.isInteger(l)||w<0||l<0||w+l===0||aw<0||al<0)return $('#btResult').textContent='أدخل قيماً صحيحة ومجموع صفقات أكبر من صفر.';const pf=l*al===0?'غير معرّف':(w*aw/(l*al)).toFixed(2);$('#btResult').textContent='عدد الصفقات: '+(w+l)+' | Win Rate: '+(w/(w+l)*100).toFixed(2)+'% | Profit Factor: '+pf}}}
async function social(v){v.innerHTML='<div class="panel"><h3 class="gold">SADEEQI SOCIAL HUB</h3><p>مركز حالة تكاملات منصات التواصل الاجتماعي.</p><div id="socialStatus" class="muted">جارٍ جلب الحالة من الخادم...</div><button class="btn secondary" id="refreshSocial">تحديث الحالة</button><div id="providers"></div><p class="notice">لا توجد عمليات OAuth أو ربط حسابات أو نشر مفعّلة حالياً. لن نطلب كلمة مرور حساباتك ولن ندّعي اتصالاً غير موجود.</p></div>';async function load(){const out=$('#socialStatus');out.textContent='جارٍ التحديث...';try{const {data}=await supabase.auth.getSession();const r=await fetch('/v1/social/providers',{headers:{Authorization:'Bearer '+data.session.access_token}});const j=await r.json();if(!r.ok)throw Error(j.error||'فشل جلب الحالة');out.textContent='الحسابات المتصلة: '+j.connectedCount+' · إعدادات المطور المكتملة: '+j.configuredCount+' من 15';$('#providers').innerHTML=(j.providers||[]).map(p=>'<div class="item"><b>'+safe(p.name)+'</b><p class="small">'+safe(p.auth)+' · '+(p.configured?'إعداد المطور موجود':'يتطلب إعداد المطور')+' · '+(p.connected?'متصل':'غير مربوط')+'</p><p class="small muted">'+safe(p.note)+'</p><button class="btn secondary" disabled>الربط غير مفعّل</button></div>').join('')}catch(e){out.textContent='تعذر جلب الحالة: '+e.message}}$('#refreshSocial').onclick=load;load()}
function music(v){const files=read('musicNames',[]);v.innerHTML='<div class="panel"><h3 class="gold">SADEEQI MUSIC</h3><p class="muted">تشغيل ملفات صوتية تختارها من جهازك داخل المتصفح. الملفات لا تُرفع إلى الخادم.</p><input class="field" id="audioFiles" type="file" accept="audio/*" multiple><div id="audioList"></div><div class="item"><h4 id="trackName">لا يوجد مقطع محدد</h4><audio id="player" controls></audio><div class="row"><button class="btn secondary" id="prevAudio">السابق</button><button class="btn secondary" id="nextAudio">التالي</button></div></div><p class="notice">بث Audius العالمي وخصائص Media3 الخلفية والطابور المستمر في Android لم تُنقل بعد إلى الويب. هذه نسخة تشغيل محلي أساسية.</p></div>';let urls=[];$('#audioFiles').onchange=e=>{urls.forEach(URL.revokeObjectURL);media=[...e.target.files];urls=media.map(f=>URL.createObjectURL(f));audioIndex=0;playAudio();drawList()};function drawList(){$('#audioList').innerHTML=media.map((f,i)=>'<div class="item"><button class="linkbtn" data-audio="'+i+'">♫ '+safe(f.name)+'</button></div>').join('');$('#audioList').querySelectorAll('button').forEach(b=>b.onclick=()=>{audioIndex=+b.dataset.audio;playAudio()})}function playAudio(){if(!media.length)return;$('#trackName').textContent=media[audioIndex].name;$('#player').src=urls[audioIndex];$('#player').play().catch(()=>{})}$('#nextAudio').onclick=()=>{if(media.length){audioIndex=(audioIndex+1)%media.length;playAudio()}};$('#prevAudio').onclick=()=>{if(media.length){audioIndex=(audioIndex-1+media.length)%media.length;playAudio()}}}
function search(v){v.innerHTML='<div class="panel"><h3 class="gold">البحث في المحادثات</h3><input class="field" id="chatSearch" placeholder="ابحث في سجل المحادثات"><div id="searchResults"></div></div>';const draw=()=>{const q=$('#chatSearch').value.toLowerCase();$('#searchResults').innerHTML=chat.filter(x=>x.content.toLowerCase().includes(q)).map(x=>'<div class="item"><b>'+ (x.role==='assistant'?'صديقي':'أنت')+'</b><p>'+safe(x.content)+'</p></div>').join('')||'<p class="muted">لا توجد نتائج.</p>'};$('#chatSearch').oninput=draw;draw()}
function memory(v){const saved=read('saved',[]);v.innerHTML='<div class="panel"><h3 class="gold">ذاكرة صديقي</h3><p class="notice">في نسخة الويب تُخزّن هذه البيانات محلياً في المتصفح وغير مشفرة. لا تحفظ معلومات حساسة هنا. ذاكرة Android المشفرة بـ AES-GCM وAndroid Keystore ليست مكافئة لهذا التخزين.</p><h4>الردود المحفوظة ('+saved.length+')</h4>'+saved.map((x,i)=>'<div class="item"><p>'+safe(x)+'</p><button class="btn danger" data-remove="'+i+'">حذف</button></div>').join('')+'<button class="btn secondary" id="exportMemory">تصدير JSON</button><button class="btn danger" id="clearMemory">حذف الذاكرة المحلية</button></div>';v.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{saved.splice(+b.dataset.remove,1);write('saved',saved);memory(v)});$('#clearMemory').onclick=()=>{if(confirm('هل تريد حذف الردود المحفوظة محلياً؟')){write('saved',[]);memory(v)}};$('#exportMemory').onclick=()=>download('sadeeqi-memory.json',JSON.stringify(saved,null,2))}
function toolsView(v){v.innerHTML='<div class="grid2"><div class="panel"><h3 class="gold">🎙 المساعد الصوتي</h3><p>الإملاء الصوتي عبر Web Speech API.</p><button class="btn" id="toolDictate">ابدأ الإملاء</button></div><div class="panel"><h3 class="gold">▧ تحليل الصور</h3><p>اختر صورة ثم اذهب للمحادثة الرئيسية وأرسل سؤالاً عنها.</p><input class="field" id="toolImage" type="file" accept="image/jpeg,image/png,image/webp"></div><div class="panel"><h3 class="gold">اختبار الاتصال</h3><button class="btn secondary" id="healthCheck">فحص الخادم</button><pre id="healthResult" class="small"></pre></div><div class="panel"><h3 class="gold">أوامر الهاتف</h3><p class="muted">فتح تطبيقات الهاتف، ضبط مستوى الصوت، إعداد المنبه، والوصول لإعدادات النظام وظائف Android أصلية ولا يستطيع موقع الويب تنفيذها بأمان كبديل كامل.</p><span class="pill">غير متاحة في المتصفح</span></div></div>';$('#toolDictate').onclick=()=>{setTab('الرئيسية');setTimeout(dictate,100)};$('#toolImage').onchange=async e=>{const f=e.target.files[0];if(!f)return;if(f.size>8*1024*1024)return alert('حجم الصورة أكبر من 8 ميغابايت');pendingImage=await new Promise(ok=>{const r=new FileReader();r.onload=()=>ok(r.result);r.readAsDataURL(f)});setTab('الرئيسية');setTimeout(()=>$('#imagePreview').textContent='تم إرفاق الصورة. اكتب سؤالك ثم أرسل.',100)};$('#healthCheck').onclick=async()=>{const r=await fetch('/health');$('#healthResult').textContent=JSON.stringify(await r.json(),null,2)}}
function settings(v){v.innerHTML='<div class="panel"><h3 class="gold">الإعدادات والملف الشخصي</h3><p>المساعد: صديقي</p><p>اللغة: العربية · المظهر: داكن</p><p>الخادم: <span id="settingsHealth">جارٍ الفحص...</span></p><p class="small muted">حالة الخادم تؤكد الإعداد فقط ولا تثبت نجاح المحادثة. مفاتيح مزود الذكاء الاصطناعي تبقى في الخادم.</p><button class="btn secondary" id="checkAgain">إعادة فحص الخادم</button><button class="btn danger" id="signOutAll">تسجيل الخروج</button><hr><h4>الخصوصية وحدود نسخة الويب</h4><ul class="small muted"><li>جلسة الدخول عبر Supabase Auth.</li><li>سجل المحادثة والذاكرة التعليمية في localStorage لهذا المتصفح فقط، دون تشفير مكافئ لـ Android Keystore.</li><li>لا توجد مزامنة بين المتصفح وتطبيق Android حتى الآن.</li><li>لا يوجد رفع ملفات عام أو فحص مضاد للبرمجيات الخبيثة.</li><li>لا توجد صلاحيات وصول إلى وظائف الهاتف الأصلية.</li></ul></div>';async function health(){try{const r=await fetch('/health'),j=await r.json();$('#settingsHealth').textContent=j.provider_status+' · '+j.version}catch(e){$('#settingsHealth').textContent='تعذر الاتصال'}}health();$('#checkAgain').onclick=health;$('#signOutAll').onclick=()=>supabase.auth.signOut()}
function download(name,content){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type:'application/json'}));a.download=name;a.click();URL.revokeObjectURL(a.href)}
</script></body></html>
