<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10131c"><title>صديقي AI</title>
<style>
:root{color-scheme:dark;--bg:#0d1018;--panel:#151a25;--line:#273044;--muted:#9ba7bd;--accent:#7c9cff;--text:#f4f6fb}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#26385f 0,transparent 48%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100dvh}
button,input,textarea{font:inherit}button{cursor:pointer}.shell{max-width:960px;margin:auto;min-height:100dvh;display:flex;flex-direction:column;padding:18px}
header{display:flex;align-items:center;justify-content:space-between;padding:10px 4px 18px;border-bottom:1px solid var(--line)}
.brand{display:flex;gap:12px;align-items:center}.logo{width:44px;height:44px;border-radius:15px;background:linear-gradient(135deg,#86a6ff,#7755dc);display:grid;place-items:center;font-size:24px;box-shadow:0 8px 28px #667fff33}.brand h1{font-size:19px;margin:0}.brand small{color:var(--muted)}
.status{font-size:12px;color:#9ee4bc;display:flex;gap:7px;align-items:center}.dot{width:7px;height:7px;border-radius:50%;background:#58d68d}
main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:28px 0}.auth,.chatbox{width:100%;max-width:680px;margin:auto;background:#151a25eF;border:1px solid var(--line);border-radius:24px;padding:26px;box-shadow:0 20px 70px #0005}
.auth h2{margin:0 0 8px;font-size:24px}.sub{color:var(--muted);margin:0 0 22px;line-height:1.8}.field{display:block;width:100%;margin:10px 0;padding:14px 15px;border:1px solid var(--line);border-radius:13px;background:#0e1320;color:var(--text);outline:none}.field:focus{border-color:var(--accent)}.btn{border:0;border-radius:13px;padding:13px 18px;background:linear-gradient(135deg,#7899ff,#785bd9);color:white;font-weight:700}.btn:disabled{opacity:.55;cursor:wait}.wide{width:100%;margin-top:8px}.linkbtn{background:none;border:0;color:#a9bdff;padding:12px}.error{color:#ff9d9d;min-height:22px;font-size:13px}.chatbox{display:none;max-width:860px;padding:0;overflow:hidden;min-height:65vh;flex-direction:column}
.chathead{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.chathead strong{font-size:15px}.chathead button{background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.messages{flex:1;padding:20px;display:flex;flex-direction:column;gap:14px;overflow:auto;min-height:300px;max-height:58vh}.welcome{text-align:center;color:var(--muted);margin:auto;line-height:2}.bubble{max-width:min(82%,620px);padding:13px 16px;border-radius:17px;white-space:pre-wrap;line-height:1.8;overflow-wrap:anywhere}.user{align-self:flex-start;background:#293a62;border-bottom-left-radius:5px}.assistant{align-self:flex-end;background:#202838;border:1px solid #303b50;border-bottom-right-radius:5px}
.composer{display:flex;gap:10px;padding:15px;border-top:1px solid var(--line);background:#111622}.composer textarea{flex:1;resize:none;min-height:48px;max-height:140px;background:#0d121e;border:1px solid var(--line);border-radius:14px;color:var(--text);padding:12px;outline:none}.composer .btn{min-width:82px}
footer{text-align:center;color:#68758d;font-size:12px;padding:14px}
@media(max-width:600px){.shell{padding:12px}.auth{padding:21px}.chatbox{min-height:72vh}.messages{max-height:60vh;padding:14px}.bubble{max-width:92%}}
</style>
</head>
<body><div class="shell">
<header><div class="brand"><div class="logo">✦</div><div><h1>صديقي AI</h1><small>مساعدك الرقمي الشخصي</small></div></div><div class="status"><i class="dot"></i><span>متصل بالخدمة</span></div></header>
<main>
<section class="auth" id="auth">
<h2 id="authTitle">مرحباً بك</h2><p class="sub" id="authSub">سجّل الدخول إلى حسابك وابدأ محادثتك مع صديقي مباشرة من المتصفح، دون تثبيت أي تطبيق.</p>
<input class="field" id="email" type="email" autocomplete="email" placeholder="البريد الإلكتروني">
<input class="field" id="password" type="password" autocomplete="current-password" placeholder="كلمة المرور">
<button class="btn wide" id="authSubmit">تسجيل الدخول</button>
<button class="linkbtn" id="toggleAuth">إنشاء حساب جديد</button><div class="error" id="authError"></div>
</section>
<section class="chatbox" id="chat">
<div class="chathead"><strong>✦ محادثة صديقي</strong><button id="logout">تسجيل الخروج</button></div>
<div class="messages" id="messages"><div class="welcome">أهلاً بك! أنا صديقي،<br>اكتب رسالتك وسأساعدك.</div></div>
<div class="composer"><textarea id="prompt" rows="1" placeholder="اكتب رسالتك هنا..."></textarea><button class="btn" id="send">إرسال</button></div>
</section>
</main><footer>صديقي AI · نسخة ويب تجريبية · محادثاتك محفوظة في هذا المتصفح فقط</footer></div>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
const authEl=document.querySelector('#auth'),chatEl=document.querySelector('#chat'),emailEl=document.querySelector('#email'),passEl=document.querySelector('#password'),authError=document.querySelector('#authError'),messages=document.querySelector('#messages'),promptEl=document.querySelector('#prompt'),sendBtn=document.querySelector('#send');
let supabase,signUp=false,history=[];
const cfg=await fetch('/web-config').then(r=>r.json()).catch(()=>({}));
if(!cfg.supabaseUrl||!cfg.supabaseAnonKey){document.querySelector('#authSub').textContent='واجهة الويب جاهزة، لكن يلزم ضبط SUPABASE_ANON_KEY في إعدادات Vercel Preview حتى يعمل تسجيل الدخول.';document.querySelector('#authSubmit').disabled=true;document.querySelector('#toggleAuth').hidden=true;}
else {supabase=createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);const {data}=await supabase.auth.getSession();if(data.session)showChat();supabase.auth.onAuthStateChange((_event,session)=>{if(session)showChat();else showAuth();});}
function showAuth(){authEl.style.display='block';chatEl.style.display='none'}
function showChat(){authEl.style.display='none';chatEl.style.display='flex';promptEl.focus()}
document.querySelector('#toggleAuth').onclick=()=>{signUp=!signUp;document.querySelector('#authTitle').textContent=signUp?'إنشاء حساب':'مرحباً بك';document.querySelector('#authSubmit').textContent=signUp?'إنشاء الحساب':'تسجيل الدخول';document.querySelector('#toggleAuth').textContent=signUp?'لديك حساب؟ تسجيل الدخول':'إنشاء حساب جديد';authError.textContent='';};
document.querySelector('#authSubmit').onclick=async()=>{if(!supabase)return;authError.textContent='';const email=emailEl.value.trim(),password=passEl.value;if(!email||password.length<6){authError.textContent='أدخل بريداً صحيحاً وكلمة مرور من 6 أحرف على الأقل.';return;}const b=document.querySelector('#authSubmit');b.disabled=true;b.textContent='جارٍ التنفيذ...';try{const result=signUp?await supabase.auth.signUp({email,password}):await supabase.auth.signInWithPassword({email,password});if(result.error)throw result.error;if(signUp&&!result.data.session)authError.textContent='تم إنشاء الحساب. افحص بريدك لتأكيد التسجيل ثم سجّل الدخول.';else showChat();}catch(e){authError.textContent=e.message||'تعذر تسجيل الدخول.';}finally{b.disabled=false;b.textContent=signUp?'إنشاء الحساب':'تسجيل الدخول';}};
document.querySelector('#logout').onclick=()=>supabase?.auth.signOut();
function addBubble(text,role){const empty=messages.querySelector('.welcome');if(empty)empty.remove();const el=document.createElement('div');el.className='bubble '+role;el.textContent=text;messages.append(el);messages.scrollTop=messages.scrollHeight;return el;}
async function send(){const text=promptEl.value.trim();if(!text||!supabase||sendBtn.disabled)return;promptEl.value='';addBubble(text,'user');history.push({role:'user',content:text});sendBtn.disabled=true;const waiting=addBubble('صديقي يفكر...','assistant');try{const {data}=await supabase.auth.getSession();const token=data.session?.access_token;if(!token)throw new Error('انتهت الجلسة. سجّل الدخول مجدداً.');const res=await fetch('/v1/chat',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({input:history.slice(-24)})});const body=await res.json();if(!res.ok)throw new Error(body.error||'تعذر إكمال الطلب.');waiting.textContent=body.output_text||'لم يصل رد.';history.push({role:'assistant',content:waiting.textContent});}catch(e){waiting.textContent='حدث خطأ: '+(e.message||'تعذر الاتصال');}finally{sendBtn.disabled=false;promptEl.focus();}}
sendBtn.onclick=send;promptEl.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
</script></body></html>
